name: Tungolcraft scientific package

on:
  pull_request:
    paths:
      - ".github/workflows/tungolcraft.yml"
      - "package.json"
      - "bun.lock"
      - "packages/tungolcraft/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tungolcraft.yml"
      - "package.json"
      - "bun.lock"
      - "packages/tungolcraft/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test package
        run: bun run --filter tungolcraft test

      - name: Type-check package
        run: bun run --filter tungolcraft typecheck

      - name: Build package
        run: bun run --filter tungolcraft build

      - name: Verify generated scientific documentation
        run: bun run --filter tungolcraft documentation:check

      - name: Run scientific benchmarks
        run: bun packages/tungolcraft/scripts/run-benchmarks.mjs --json --output artifacts/tungolcraft-benchmarks.json > /dev/null

      - name: Test packed package in a clean consumer
        run: bun run --filter tungolcraft pack:smoke

      - name: Upload scientific evidence
        uses: actions/upload-artifact@v4
        with:
          name: tungolcraft-scientific-evidence
          path: |
            artifacts/tungolcraft-benchmarks.json
            packages/tungolcraft/benchmarks/fixtures.json
            packages/tungolcraft/docs/VALIDATION.md
            packages/tungolcraft/docs/MODEL-REFERENCE.md
