name: Rodder views

on:
  pull_request:
    paths:
      - 'src/lib/rodder/**'
      - 'src/routes/test/rodder-*-map/**'
      - 'packages/tungolcraft/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package*.json'
      - '.github/workflows/rodder-root-map.yml'
  push:
    branches: [main]

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace packages/tungolcraft run build
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npx vitest run src/lib/rodder/root-layout.test.ts src/lib/rodder/view-state.test.ts packages/tungolcraft/src/orbit.test.ts
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
