name: Rodder checks

on:
  pull_request:
    paths:
      - "src/lib/feature/rodder/**"
      - "packages/tungolcraft/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/rodder-root-map.yml"
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter tungolcraft build
      - run: bun run check
      - run: bun run test:rodder
