services:
  app:
    image: knowthing
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: postgres://knowthing:${DB_PASSWORD:-knowthing}@db:5432/knowthing
      UPLOAD_DIR: /app/uploads
      PORT: ${PORT:-3000}
      ORIGIN: https://${DOMAIN:-localhost}
      BODY_SIZE_LIMIT: "15000000"
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowthing
      POSTGRES_PASSWORD: ${DB_PASSWORD:-knowthing}
      POSTGRES_DB: knowthing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knowthing']
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
