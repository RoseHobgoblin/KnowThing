services:
  app:
    image: knowthing
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      DATABASE_URL: postgres://knowthing:${DB_PASSWORD:-knowthing}@db:5432/knowthing
      UPLOAD_DIR: /app/uploads
      PORT: ${PORT:-3000}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowthing
      POSTGRES_PASSWORD: ${DB_PASSWORD:-knowthing}
      POSTGRES_DB: knowthing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knowthing']
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment when you have a domain pointed at the server:
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   environment:
  #     DOMAIN: ${DOMAIN:-localhost}
